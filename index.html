<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>DevLinks</title>
</head>
<body>
    <div id="container">
        <div id="profile">
            <img src="./images/dog.jpg" alt="imagem de perfil do usuário" />
            <p>@Caramelo</p>
        </div>
        <div id="switch" onclick="toggleMode()">
            <button></button>
            <span></span>
        </div>
        <ul>
            <li><a href="#">Inscrever-se na NLW</a></li>
            <li><a href="#">Baixar meu e-book</a></li>
            <li><a href="#">Veja meu portfólio</a></li>
            <li><a href="https://www.google.com.br/index.html" target="_blank">Conheça o explorer</a></li>
        </ul>
        <div id="social-links">
            <a href="https://www.github.com" target="_blank">
                <ion-icon name="logo-github"></ion-icon>
            </a>
            <a href="https://www.instagram.com" target="_blank">
                <ion-icon name="logo-instagram"></ion-icon>
            </a>
            <a href="https://www.linkedin.com" target="_blank">
                <ion-icon name="logo-linkedin"></ion-icon>
            </a>
            <a href="https://www.youtube.com" target="_blank">
                <ion-icon name="logo-youtube"></ion-icon>
            </a>
        </div>
        <footer>
            <p>Feito com <ion-icon name="heart"></ion-icon> pela <a href="https://www.rocketseat.com" target="_blank">RocketSeat.</a></p>
        </footer>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="script.js"></script>
</body>
</html>
